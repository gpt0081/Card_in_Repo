name: live-teaching-smoke

on:
  workflow_dispatch:
    inputs:
      level:
        description: Teaching depth to verify
        required: true
        default: all
        type: choice
        options:
          - all
          - basic
          - intermediate
          - advanced
          - deep

permissions:
  contents: read

# A live probe spends external-provider quota and mutates a shared smoke database.
# Keep at most one run active so repeated dispatches cannot race or multiply cost.
concurrency:
  group: live-teaching-smoke
  cancel-in-progress: false

jobs:
  public-provider:
    # A configured self-hosted runner means the provider is network-local/private,
    # regardless of whether its endpoint uses HTTP or HTTPS. Without that runner,
    # public HTTPS providers use an isolated GitHub-hosted pgvector database.
    if: ${{ vars.LIVE_TEACHING_RUNNER == '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    services:
      postgres:
        # pgvector/pgvector is the upstream pgvector image (PostgreSQL License).
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: card_in_repo
          POSTGRES_PASSWORD: card_in_repo
          POSTGRES_DB: card_in_repo_live_smoke
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U card_in_repo -d card_in_repo_live_smoke"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEACHING_LLM_ENDPOINT: ${{ vars.TEACHING_LLM_ENDPOINT }}
      TEACHING_LLM_MODEL: ${{ vars.TEACHING_LLM_MODEL }}
      TEACHING_LLM_API_KEY: ${{ secrets.TEACHING_LLM_API_KEY }}
      TEACHING_LLM_TIMEOUT_SECONDS: ${{ vars.TEACHING_LLM_TIMEOUT_SECONDS }}
      TEACHING_LLM_MAX_RESPONSE_BYTES: ${{ vars.TEACHING_LLM_MAX_RESPONSE_BYTES }}
      TEACHING_SMOKE_LEVEL: ${{ inputs.level }}
      DATABASE_URL: postgresql://card_in_repo:card_in_repo@localhost:5432/card_in_repo_live_smoke
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install API
        run: python -m pip install -e apps/api
      - name: Require provider configuration
        run: |
          test -n "$TEACHING_LLM_ENDPOINT"
          test -n "$TEACHING_LLM_MODEL"
      - name: Probe provider, evidence verifier, and durable persistence
        run: python apps/api/scripts/live_teaching_smoke.py

  private-provider:
    # Selecting a self-hosted runner is the explicit execution-mode switch. This
    # also covers localhost providers and private HTTPS endpoints, which do not
    # need the cleartext-private HTTP opt-in. A Mac Studio can therefore host the
    # runner and provider directly. Point LIVE_TEACHING_DATABASE_URL at PostgreSQL
    # reachable from that runner or elsewhere on its Tailscale network.
    if: ${{ vars.LIVE_TEACHING_RUNNER != '' }}
    runs-on: ${{ vars.LIVE_TEACHING_RUNNER }}
    timeout-minutes: 5
    env:
      TEACHING_LLM_ENDPOINT: ${{ vars.TEACHING_LLM_ENDPOINT }}
      TEACHING_LLM_MODEL: ${{ vars.TEACHING_LLM_MODEL }}
      TEACHING_LLM_API_KEY: ${{ secrets.TEACHING_LLM_API_KEY }}
      CARD_IN_REPO_ALLOW_PRIVATE_HTTP_TEACHING: ${{ vars.CARD_IN_REPO_ALLOW_PRIVATE_HTTP_TEACHING }}
      LIVE_TEACHING_RUNNER: ${{ vars.LIVE_TEACHING_RUNNER }}
      TEACHING_LLM_TIMEOUT_SECONDS: ${{ vars.TEACHING_LLM_TIMEOUT_SECONDS }}
      TEACHING_LLM_MAX_RESPONSE_BYTES: ${{ vars.TEACHING_LLM_MAX_RESPONSE_BYTES }}
      TEACHING_SMOKE_LEVEL: ${{ inputs.level }}
      DATABASE_URL: ${{ vars.LIVE_TEACHING_DATABASE_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install API
        run: python -m pip install -e apps/api
      - name: Require private provider configuration
        run: |
          test -n "$TEACHING_LLM_ENDPOINT"
          test -n "$TEACHING_LLM_MODEL"
          test -n "$DATABASE_URL" || {
            echo "Private teaching smoke requires LIVE_TEACHING_DATABASE_URL pointing at PostgreSQL reachable from the self-hosted runner." >&2
            exit 1
          }
      - name: Probe provider, evidence verifier, and durable persistence
        run: python apps/api/scripts/live_teaching_smoke.py

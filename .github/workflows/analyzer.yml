name: analyzer

on:
  push:
    branches: [main]
  pull_request:

jobs:
  python-analyzer:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/analyzer
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e '.[test]'
      - run: pytest -q

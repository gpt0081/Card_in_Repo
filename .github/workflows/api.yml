name: api

on:
  push:
    branches: [main]
  pull_request:

jobs:
  vertical-slice:
    runs-on: ubuntu-latest
    services:
      postgres:
        # pgvector/pgvector is the upstream pgvector image (PostgreSQL License).
        # Retrieval integration tests execute CREATE EXTENSION vector, so CI must
        # exercise the same database capability required by the product runtime.
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: card_in_repo
          POSTGRES_PASSWORD: card_in_repo
          POSTGRES_DB: card_in_repo_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U card_in_repo -d card_in_repo_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://card_in_repo:card_in_repo@localhost:5432/card_in_repo_test
      TEST_REDIS_URL: redis://localhost:6379/15
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e '.[test]'
      - run: pytest -q

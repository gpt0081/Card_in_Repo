services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: card_in_repo
      POSTGRES_PASSWORD: card_in_repo
      POSTGRES_DB: card_in_repo
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U card_in_repo -d card_in_repo"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  object-storage:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: card_in_repo
      MINIO_ROOT_PASSWORD: card_in_repo_dev_only
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - object-data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres-data:
  redis-data:
  object-data:

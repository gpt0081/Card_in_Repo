[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "card-in-repo-api"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115,<1"]

[project.optional-dependencies]
test = ["httpx>=0.27,<1", "pytest>=8,<9", "tree-sitter>=0.25,<0.26", "tree-sitter-python>=0.25,<0.26"]

[tool.pytest.ini_options]
pythonpath = ["src", "../../packages/analyzer/src"]
testpaths = ["tests"]

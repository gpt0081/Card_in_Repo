[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "card-in-repo-analyzer"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["tree-sitter>=0.25,<0.26", "tree-sitter-python>=0.25,<0.26"]

[project.optional-dependencies]
test = ["pytest>=8,<9"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
